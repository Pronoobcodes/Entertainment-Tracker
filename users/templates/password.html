{% extends "main/body.html" %}

{% block content %}

<div class="auth-box">
    <h3 class="text-center mb-3">Change Password</h3>
    <p class="text-center text-secondary mb-4">
        Secure your MovieBox account
    </p>

    <form method="POST">
        {% csrf_token %}

        {% for field in form %}
            <div class="mb-3">
                {{ field }}
                {% if field.help_text %}
                    <small class="text-secondary">{{ field.help_text|safe }}</small>
                {% endif %}
                {% if field.errors %}
                    <small class="text-danger">{{ field.errors }}</small>
                {% endif %}
            </div>
        {% endfor %}

        <button class="btn btn-danger mt-3">Update Password</button>
    </form>
</div>

{% endblock %}
