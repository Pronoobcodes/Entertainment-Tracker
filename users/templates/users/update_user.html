{% extends "main/body.html" %}

{% block content %}

<div class="auth-box">
    <h3 class="text-center mb-3">Update Profile</h3>
    <p class="text-center text-secondary mb-4">Update your account information</p>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label for="full_name" class="form-label">Full Name</label>
            <input type="text" class="form-control" name="full_name" id="full_name" value="{{ user.full_name }}" placeholder="Enter your full name">
        </div>

        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" name="username" id="username" value="{{ user.username }}" placeholder="Enter your username">
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" class="form-control" name="email" id="email" value="{{ user.email }}" placeholder="Enter your email">
        </div>

        <button class="btn btn-danger mt-3 w-100">Update Profile</button>
    </form>

    <div class="text-center mt-3">
        <a href="{% url 'home' %}" class="auth-link">Go back home</a>
    </div>
</div>

{% endblock %}
