{% extends "main/body.html" %}

{% block content %}

<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6 col-lg-5">
            <div class="auth-box">
                <div class="text-center mb-4">
                    <i class="fas fa-user-edit text-primary" style="font-size: 2rem;"></i>
                    <h2 class="mt-3">Edit Profile</h2>
                    <p class="text-secondary">Update your account information</p>
                </div>

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="full_name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" name="full_name" id="full_name" 
                               value="{{ user.full_name }}" placeholder="John Doe">
                    </div>

                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" name="username" id="username" 
                               value="{{ user.username }}" placeholder="johndoe">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" name="email" id="email" 
                               value="{{ user.email }}" placeholder="john@example.com">
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mt-4">
                        <i class="fas fa-save me-2"></i>Save Changes
                    </button>
                </form>

                <hr class="my-4">

                <div class="row g-2">
                    <div class="col-6">
                        <a href="{% url 'change_password' %}" class="btn btn-outline-primary w-100 btn-sm">
                            <i class="fas fa-lock me-1"></i>Change Password
                        </a>
                    </div>
                    <div class="col-6">
                        <a href="{% url 'profile' %}" class="btn btn-outline-secondary w-100 btn-sm">
                            <i class="fas fa-arrow-left me-1"></i>Go Back
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
