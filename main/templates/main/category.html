{% extends "main/body.html" %}
{% block content %}

<div class="container-fluid mt-4 px-4">

    <h3 class="mb-3 text-capitalize">
        {{ category }} • Most Popular
    </h3>

    
    <form method="get" class="row g-2 mb-4">

    <div class="col-md-3">
        <select name="genre" class="form-select">
            <option value="">All Genres</option>
            {% for g in genres %}
                <option value="{{ g.id }}"
                    {% if genre == g.id|stringformat:"s" %}selected{% endif %}
                >
                    {{ g.name }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="col-md-2">
        <select name="year" class="form-select">
            <option value="">Year</option>
            {% for y in years %}
                <option value="{{ y }}">{{ y }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="col-md-2">
        <button class="btn btn-danger w-100">Filter</button>
    </div>

</form>

    <div id="results" class="row g-4">
        {% for item in results %}
            {% include "main/card.html" %}
        {% endfor %}
    </div>

    <div id="loader" class="text-center my-4 d-none">
        <div class="spinner-border text-danger"></div>
    </div>




</div>

{% endblock %}
