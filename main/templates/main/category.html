{% extends "main/body.html" %}
{% block content %}

<div class="container-fluid px-4 py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold text-capitalize">
            {{ category }} <span class="text-muted">• Popular</span>
        </h3>
    </div>

    <!-- Filters -->
    <form method="get" class="row g-2 align-items-end mb-4 filter-bar">
        <div class="col-md-3">
            <label class="form-label text-muted">Genre</label>
            <select name="genre" class="form-select">
                <option value="">All Genres</option>
                {% for g in genres %}
                    <option value="{{ g }}" {% if g == selected_genre %}selected{% endif %}>{{ g }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="col-md-3">
            <label class="form-label text-muted">Year</label>
            <select name="year" class="form-select">
                <option value="">All Years</option>
                {% for y in years %}
                    <option value="{{ y }}" {% if y == selected_year %}selected{% endif %}>{{ y }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="col-md-2">
            <button class="btn btn-danger w-100">Apply</button>
        </div>
    </form>

    <!-- Results -->
    <div class="row g-4">
        {% for item in results %}
            {% include "main/card.html" %}
        {% empty %}
            <p class="text-muted">No results found.</p>
        {% endfor %}
    </div>

</div>

{% endblock %}
