{% extends "main/body.html" %}
{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div style="padding: 60px 20px;">
                <h1 class="display-1 fw-bold text-danger mb-3">500</h1>
                <h2 class="mb-3">Server Error</h2>
                <p class="text-secondary mb-4">
                    Something went wrong on our end. Please try again later.
                </p>
                <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                    <a href="{% url 'home' %}" class="btn btn-primary btn-lg px-4 gap-3">
                        <i class="fas fa-home me-2"></i>Back to Home
                    </a>
                    <a href="javascript:history.back()" class="btn btn-outline-primary btn-lg px-4">
                        <i class="fas fa-arrow-left me-2"></i>Go Back
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
