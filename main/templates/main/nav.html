{% load static %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary sticky-top">
    <div class="container-fluid px-4">
        <!-- Brand -->
        <a class="navbar-brand d-flex align-items-center fw-bold" href="{% url 'home' %}">
            <i class="fas fa-film me-2 text-primary" style="font-size: 1.5rem;"></i>
            <span>Entertainment Tracker</span>
        </a>

        <!-- Toggle button -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Collapsible content -->
        <div class="collapse navbar-collapse" id="nav">
            <!-- Left side navigation -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'movies' %}">
                        <i class="fas fa-film me-1"></i> Movies
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'series' %}">
                        <i class="fas fa-tv me-1"></i> Series
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'anime' %}">
                        <i class="fas fa-image me-1"></i> Anime
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'mangas' %}">
                        <i class="fas fa-book me-1"></i> Manga
                    </a>
                </li>
            </ul>

            <!-- Search form -->
            <form class="d-flex me-3" method="get" action="{% url 'home' %}">
                <div class="input-group">
                    <input
                        class="form-control form-control-sm search-input"
                        type="search"
                        name="q"
                        placeholder="Search..."
                        value="{{ query }}"
                    >
                    <button class="btn btn-outline-primary btn-sm" type="submit">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </form>

            <!-- Right side navigation -->
            <ul class="navbar-nav">
                {% if request.user.is_authenticated %}
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-user-circle me-1"></i> {{ request.user.username }}
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                            <li><a class="dropdown-item" href="{% url 'profile' %}">
                                <i class="fas fa-list me-2"></i> My Library
                            </a></li>
                            <li><a class="dropdown-item" href="{% url 'update_user' %}">
                                <i class="fas fa-edit me-2"></i> Update Profile
                            </a></li>
                            <li><a class="dropdown-item" href="{% url 'change_password' %}">
                                <i class="fas fa-lock me-2"></i> Change Password
                            </a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="{% url 'logout' %}">
                                <i class="fas fa-sign-out-alt me-2"></i> Logout
                            </a></li>
                        </ul>
                    </li>
                {% else %}
                    <li class="nav-item">
                        <a class="nav-link btn btn-primary btn-sm text-white ms-2" href="{% url 'login' %}">
                            <i class="fas fa-sign-in-alt me-1"></i> Login
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn btn-outline-primary btn-sm ms-2" href="{% url 'register' %}">
                            <i class="fas fa-user-plus me-1"></i> Register
                        </a>
                    </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>
